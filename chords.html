<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Trainer</title>
<style>
  /* Same colour setup as the other trainers */
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f1d1a;
    --muted: #6b665e;
    --line: #2a2723;
    --accent: #3b5bdb;
    --accent-soft: #a9b8f2;
    --good: #2b8a3e;
    --bad: #c92a2a;
    --btn: #ece8df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a;
      --card: #222127;
      --ink: #f1efe9;
      --muted: #a29d94;
      --line: #e6e2da;
      --accent: #8ea2ff;
      --accent-soft: #4a5a9e;
      --good: #69db7c;
      --bad: #ff8787;
      --btn: #2f2d35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px;
  }
  main { max-width: 620px; margin: 0 auto; }
  a { color: var(--accent); }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }

  /* Guitar / Piano switch */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--btn); margin-bottom: 16px; }
  .seg button { font: inherit; font-size: 1.05rem; font-weight: 700; padding: 9px; border: none; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* Which chords are in the quiz: rows of toggle buttons ("chips"), like the Chord library */
  .filters { background: var(--card); border-radius: 14px; padding: 8px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  .filter { padding: 8px 0; }
  .filter + .filter { border-top: 1px solid var(--btn); }
  .filter-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .filter-head h2 { margin: 0; }
  .link-btn { background: none; border: none; padding: 0; color: var(--accent); font: inherit; font-size: 0.8rem; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 0.85rem; font-weight: 600;
    padding: 4px 11px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--btn); background: transparent; color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:hover { border-color: var(--accent); }
  .settings { display: flex; flex-wrap: wrap; gap: 12px; }
  .settings label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--muted); }
  select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--btn); background: var(--card); color: var(--ink); }

  .card { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #diagram { display: block; width: 100%; max-width: 260px; height: auto; margin: 0 auto; }
  #diagram.piano { max-width: 420px; }
  .grid-line { stroke: var(--line); stroke-width: 1.5; }
  .nut { stroke: var(--line); stroke-width: 6; }
  .finger { fill: var(--line); }
  .finger.root { fill: var(--accent); }
  .marker { fill: none; stroke: var(--line); stroke-width: 2; }
  .label { fill: var(--muted); font-size: 13px; text-anchor: middle; font-family: system-ui, sans-serif; }
  .fret-label { fill: var(--ink); font-size: 14px; font-weight: 600; text-anchor: middle; font-family: system-ui, sans-serif; }
  /* Piano keys (drawn by chord-data.js) */
  .pk-white { fill: #fdfdfb; stroke: #555; stroke-width: 1; }
  .pk-black { fill: #1c1c1c; }
  .pk-on { fill: var(--accent-soft); }
  .pk-root { fill: var(--accent); }
  .pk-label { fill: #888; font-size: 8px; text-anchor: middle; font-family: system-ui, sans-serif; }

  .feedback { min-height: 1.6em; text-align: center; font-weight: 600; font-size: 1.1rem; margin: 8px 0 0; }
  .feedback.good { color: var(--good); }
  .feedback.bad  { color: var(--bad); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }

  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
  .choices button, .hear {
    font: inherit; font-weight: 600; line-height: 1.15;
    padding: 10px 0; border: 2px solid transparent; border-radius: 10px;
    background: var(--btn); color: var(--ink); cursor: pointer;
  }
  .choices button small { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
  .choices button:hover, .hear:hover { border-color: var(--accent); }
  .choices button.picked { border-color: var(--accent); background: var(--card); }
  .choices button.good { background: var(--good); color: #fff; border-color: var(--good); }
  .choices button.bad  { background: var(--bad);  color: #fff; border-color: var(--bad); }
  .choices button.good small, .choices button.bad small { color: #fff; }
  .hear { display: block; margin: 8px auto 0; padding: 6px 16px; }

  .stats { display: flex; justify-content: space-around; margin-top: 16px; text-align: center; }
  .stats b { display: block; font-size: 1.4rem; }
  .stats span { color: var(--muted); font-size: 0.8rem; }
  .hint { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 16px; line-height: 1.5; }
  .progress { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 0 0 4px; }
  /* "Only ones I know" ignores the type/root/shape filters, so hide them */
  .known-only .filter-only { display: none !important; }
</style>
</head>
<body>
<script src="nav.js"></script><script src="sync.js"></script>
<main>
  <h1>Chord Trainer</h1>
  <p class="sub">Look at the chord and name it: pick the root note and the chord type.</p>

  <div class="seg" role="group" aria-label="Instrument">
    <button data-instrument="guitar">Guitar</button>
    <button data-instrument="piano">Piano</button>
  </div>

  <div class="filters">
    <div class="filter filter-only">
      <div class="filter-head"><h2>Chord types</h2>
        <button class="link-btn" data-all="types">All</button><button class="link-btn" data-none="types">None</button></div>
      <div class="chips" id="typeChips"></div>
    </div>
    <div class="filter filter-only">
      <div class="filter-head"><h2>Root notes</h2>
        <button class="link-btn" data-all="roots">All</button><button class="link-btn" data-none="roots">None</button></div>
      <div class="chips" id="rootChips"></div>
    </div>
    <div class="filter settings">
      <label>Chords
        <select id="knownOnly">
          <option value="off">Use the filters</option>
          <option value="on">Only ones I know</option>
        </select>
      </label>
      <label class="guitar-only filter-only">Shapes
        <select id="shapes">
          <option value="open">Open chords only</option>
          <option value="low">Near the nut</option>
          <option value="all">Whole neck</option>
        </select>
      </label>
      <label>Root note
        <select id="rootDot">
          <option value="on">Highlight</option>
          <option value="off">Don't highlight</option>
        </select>
      </label>
      <label class="guitar-only">Hand
        <select id="hand">
          <option value="right">Right-handed</option>
          <option value="left">Left-handed</option>
        </select>
      </label>
      <label>Sound
        <select id="sound">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </label>
    </div>
  </div>

  <div class="card">
    <p class="progress" id="progress"></p>
    <svg id="diagram" viewBox="0 0 240 285" aria-label="Chord diagram"></svg>
    <p class="empty" id="empty" hidden></p>
    <button class="hear" id="hearBtn">▶ Hear it</button>
    <div class="feedback" id="feedback"></div>
    <h2>Root note</h2>
    <div class="choices" id="roots"></div>
    <h2>Chord type</h2>
    <div class="choices" id="types"></div>
    <div id="bassBox" hidden>
      <h2>Bass note</h2>
      <div class="choices" id="basses"></div>
    </div>
  </div>

  <div class="stats">
    <div><b id="score">0 / 0</b><span>correct</span></div>
    <div><b id="streak">0</b><span>streak</span></div>
    <div><b id="best">0</b><span>best streak</span></div>
  </div>
  <div class="weak" id="weak" hidden></div>
  <p class="hint" id="hint"></p>
</main>

<!-- The chord list, diagram drawing, piano keyboard and guitar sound are shared with the chord library;
     piano-sound.js is the piano -->
<script src="chord-data.js"></script>
<script src="piano-sound.js"></script>
<script src="recent.js"></script>
<script src="weak.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $("diagram");

// ---------- Settings, remembered between visits ----------
// types / roots: which chords are in the quiz. The first time: major and minor, every root.
let settings = { instrument: "guitar", types: ["maj", "min"], roots: NOTES.map((_, i) => String(i)), shapes: "open", rootDot: "on", sound: "on", knownOnly: "off" };
try { settings = { ...settings, ...JSON.parse(localStorage.getItem("chordTrainer")) }; } catch (e) {}
const SAVED = ["shapes", "rootDot", "sound", "knownOnly"];
SAVED.forEach(id => $(id).value = settings[id]);
function save() {
  SAVED.forEach(id => settings[id] = $(id).value);
  try { localStorage.setItem("chordTrainer", JSON.stringify(settings)); } catch (e) {}
}
const piano = () => settings.instrument === "piano";
// Guitar and piano each have their own best streak (the guitar one is also used by My journey)
const bestKey = () => piano() ? "chordTrainerPianoBest" : "chordTrainerBest";

// ---------- Drawing and sound, using the shared code in chord-data.js ----------
// On the piano, a "chord" is just { root, type }: its notes come from pianoChord, lowest note = the root.
function draw(chord) {
  svg.classList.toggle("piano", piano());
  if (piano()) {
    drawPianoChord(svg, pianoNotes(chord), $("rootDot").value === "on" ? 48 + chord.root : null);
  } else {
    svg.setAttribute("viewBox", "0 0 240 285");
    // The diagram colours the lowest note as the root. In a slash chord the lowest note is the bass
    // instead, so colouring it would be misleading (and give the bass away): no highlight then.
    drawChord(svg, chord, { lefty: $("hand").value === "left", showRoot: $("rootDot").value === "on" && !chord.slash });
  }
}

// Piano notes: a slash chord (from SLASH_CHORDS in chord-data.js) gets its bass note an octave below the chord
const pianoNotes = c => c.slash ? pianoSlashChord(c) : pianoChord(c.root, c.type.id);

function play(chord) {
  if ($("sound").value !== "on") return;
  if (piano()) pianoNotes(chord).forEach((m, i) => playPiano(m, i * 0.02));
  else strum(chord);
}

// ---------- Slash chords ----------
// A slash chord like G/B is answered in three parts: root G, type major, bass note B.
// A normal chord's bass is "none" (its bass note is just the root).
const answerType = c => c.slash ? c.chordType.id : c.type.id;
const answerBass = c => c.slash ? c.bass : "none";

// ---------- Which chords can come up ----------
// The chords you marked as known (or mastered) in the chord library, saved as "chordsKnown".
// On the guitar each shape is marked on its own ("0-maj-x,3,2,0,1,0"), on the piano the chord ("0-maj").
const knownOnly = () => $("knownOnly").value === "on";
function knownMarks() {
  try { return (JSON.parse(localStorage.getItem("chordsKnown")) || {})[settings.instrument] || {}; } catch (e) { return {}; }
}
const guitarId = c => `${c.root}-${c.type.id}-${c.frets.map(f => f === null ? "x" : f).join(",")}`;

function pool() {
  if (knownOnly()) {
    // Only your known chords: the type, root and shape filters don't apply
    const marks = knownMarks();
    if (!piano()) return [...CHORDS, ...SLASH_CHORDS].filter(c => marks[guitarId(c)]);
    return Object.keys(marks).flatMap(id => {
      const [root, typeId] = id.split("-");
      const type = TYPES.find(t => t.id === typeId);
      if (type) return [{ root: Number(root), type }];
      // A slash chord is marked as "<root>-slash<bass>" (e.g. "7-slash11" = G/B)
      return SLASH_CHORDS.filter(s => `${s.root}-${s.type.id}` === id);
    });
  }
  const types = TYPES.filter(t => settings.types.includes(t.id));
  const roots = settings.roots.map(Number);
  // The "Slash chords" chip adds the common slash chords (whose top chord has a root you picked).
  // They're all played near the nut, so the Shapes setting doesn't apply to them.
  const slash = settings.types.includes("slash") ? SLASH_CHORDS.filter(s => roots.includes(s.root)) : [];
  if (piano()) return [...roots.flatMap(root => types.map(type => ({ root, type }))), ...slash];
  const shapes = $("shapes").value;
  return [...slash, ...CHORDS.filter(c => {
    if (!settings.types.includes(c.type.id) || !roots.includes(c.root)) return false;
    if (shapes === "open") return position(c) === "open";
    if (shapes === "low") return position(c) !== "high"; // open chords + barres within the first 4 frets
    return true;
  })];
}

// ---------- Game logic ----------
let current = null;
let pickedRoot = null, pickedType = null, pickedBass = null;
let locked = false;
let correct = 0, total = 0, streak = 0;
let nextTimer = null;
const bestOf = () => { try { return Number(localStorage.getItem(bestKey())) || 0; } catch (e) { return 0; } };

// Accuracy over your last 50 answers (recent.js), per instrument like the best streak
const recentKey = () => piano() ? "chordTrainerPianoRecent" : "chordTrainerRecent";
const recent = lastAnswers(recentKey()).mount(document.querySelector(".stats"), $("score").parentNode);
// Weak spots (weak.js), per instrument too
const weakGuitar = weakSpots("chordTrainerWeak"), weakPiano = weakSpots("chordTrainerPianoWeak");
const weak = () => piano() ? weakPiano : weakGuitar;
function showWeak() {
  const keys = [...new Set(pool().map(chordKey))];
  weak().show($("weak"), keys, k => {
    if (k.includes("/")) return k; // a slash chord's key is its name, like "G/B"
    const [root, type] = k.split("-");
    return pretty(Number(root)) + TYPES.find(t => t.id === type).suffix;
  });
}

const feedback = $("feedback");
const rootsEl = $("roots");
const typesEl = $("types");

// Chords are dealt like a shuffled deck of cards: every chord name (like "Am" or "F♯7")
// comes up once before any repeats. Then the deck is shuffled again.
let deck = [], deckSize = 0;
// A slash chord's key is its name: D/C and Dm/C share a root and a bass, so "root-type" wouldn't tell them apart
const chordKey = c => c.slash ? c.name : c.root + "-" + c.type.id;

function shuffle(list) {
  // Fisher–Yates: walk backwards, swapping each item with a random earlier (or same) one
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function nextRound() {
  clearTimeout(nextTimer);
  const options = pool();
  locked = false;
  pickedRoot = pickedType = pickedBass = null;
  feedback.textContent = "";
  feedback.className = "feedback";
  buildButtons();

  if (options.length === 0) {
    current = null;
    svg.style.display = "none";
    $("hearBtn").style.display = "none";
    $("progress").textContent = "";
    $("empty").hidden = false;
    $("empty").innerHTML = knownOnly()
      ? `You haven't marked any ${piano() ? "piano" : "guitar"} chords as known yet. Mark them in the <a href="chord-library.html">Chord library</a>.`
      : settings.types.length === 0 || settings.roots.length === 0
      ? "Pick at least one chord type and one root note."
      : "There are no shapes for these chords here. Try \"Near the nut\" or \"Whole neck\" under Shapes.";
    return;
  }
  svg.style.display = "";
  $("hearBtn").style.display = "";
  $("empty").hidden = true;

  showWeak();
  if (deck.length === 0) {
    // Every chord once, plus extra cards for the ones you've been getting wrong (weak.js): up to 3 more
    const keys = [...new Set(options.map(chordKey))];
    deck = shuffle(keys.flatMap(k => Array(1 + Math.round(weak().missRate(k) * 3)).fill(k)));
    deckSize = deck.length;
    // Don't start a new deck with the chord we just had
    if (current && deck.length > 1 && deck[deck.length - 1] === chordKey(current)) [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
  }
  const key = deck.pop();
  // On the guitar a chord can have several shapes (e.g. an open one and a barre one); pick one of them
  let shapes = options.filter(c => chordKey(c) === key);
  // If you've marked shapes of this chord as known in the chord library, show one of those:
  // that's the shape you actually play. (It wins even over the Shapes setting.)
  if (!piano()) {
    const marks = knownMarks();
    const mine = [...CHORDS, ...SLASH_CHORDS].filter(c => chordKey(c) === key && marks[guitarId(c)]);
    if (mine.length) shapes = mine;
  }
  current = shapes[Math.floor(Math.random() * shapes.length)];
  $("progress").textContent = `Chord ${deckSize - deck.length} of ${deckSize}`;
  draw(current);
}

// The answer buttons: all 12 roots, and only the chord types you picked
function buildButtons() {
  rootsEl.innerHTML = "";
  NOTES.forEach((n, i) => {
    const b = document.createElement("button");
    b.innerHTML = FLATS[n] ? `${pretty(i)}<br><small>${FLATS[n]}</small>` : n;
    b.dataset.root = i;
    b.onclick = () => { pickedRoot = i; mark(rootsEl, b); check(); };
    rootsEl.appendChild(b);
  });
  typesEl.innerHTML = "";
  // The type buttons: only the types of the chords that can come up (for G/B that's major)
  const options = pool();
  const ids = new Set(options.map(answerType));
  const types = TYPES.filter(t => ids.has(t.id));
  types.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t.label;
    b.dataset.type = t.id;
    b.onclick = () => { pickedType = t.id; mark(typesEl, b); check(); };
    typesEl.appendChild(b);
  });
  // With only one type in the quiz there's nothing to choose: it's picked for you
  if (types.length === 1) {
    pickedType = types[0].id;
    typesEl.firstChild.classList.add("picked");
  }

  // The bass note row, only when slash chords can come up. Then every chord needs a bass answer:
  // "None" for a normal chord, or the note after the slash.
  const hasSlash = options.some(c => c.slash);
  $("bassBox").hidden = !hasSlash;
  const bassEl = $("basses");
  bassEl.innerHTML = "";
  if (!hasSlash) { pickedBass = "none"; return; }
  ["none", ...NOTES.map((_, i) => i)].forEach(v => {
    const b = document.createElement("button");
    const n = NOTES[v];
    b.innerHTML = v === "none" ? "None<br><small>no slash</small>" : FLATS[n] ? `/${pretty(v)}<br><small>/${FLATS[n]}</small>` : "/" + n;
    b.dataset.bass = v;
    b.onclick = () => { pickedBass = v; mark(bassEl, b); check(); };
    bassEl.appendChild(b);
  });
}

function mark(group, button) {
  if (locked) return;
  group.querySelectorAll("button").forEach(b => b.classList.remove("picked"));
  button.classList.add("picked");
}

// Once both a root and a type are picked, check the answer
function check() {
  if (locked || !current || pickedRoot === null || pickedType === null || pickedBass === null) return;
  locked = true;
  total++;

  const rootRight = pickedRoot === current.root;
  const typeRight = pickedType === answerType(current);
  const bassRight = pickedBass === answerBass(current);
  const right = rootRight && typeRight && bassRight;
  if (right) { correct++; streak++; } else { streak = 0; }
  recent.add(right);
  weak().add(chordKey(current), right);
  showWeak();
  if (streak > bestOf()) { try { localStorage.setItem(bestKey(), streak); } catch (e) {} }

  // Green for the right answer in each row, red for a wrong pick
  rootsEl.querySelector(`[data-root="${current.root}"]`).classList.add("good");
  typesEl.querySelector(`[data-type="${answerType(current)}"]`).classList.add("good");
  if (!rootRight) rootsEl.querySelector(`[data-root="${pickedRoot}"]`).classList.add("bad");
  if (!typeRight) typesEl.querySelector(`[data-type="${pickedType}"]`).classList.add("bad");
  if (!$("bassBox").hidden) {
    $("basses").querySelector(`[data-bass="${answerBass(current)}"]`).classList.add("good");
    if (!bassRight) $("basses").querySelector(`[data-bass="${pickedBass}"]`).classList.add("bad");
  }

  play(current);
  feedback.textContent = right ? `Yes! ${chordName(current)}` : `That was ${chordName(current)}`;
  feedback.className = "feedback " + (right ? "good" : "bad");
  updateStats();

  nextTimer = setTimeout(nextRound, right ? 1500 : 3000);
}

function updateStats() {
  $("score").textContent = `${correct} / ${total}`;
  $("streak").textContent = streak;
  $("best").textContent = bestOf();
}

// ---------- Chord type and root chips ----------
const CHIP_ITEMS = {
  types: [...TYPES.map(t => ({ id: t.id, label: t.label })), { id: "slash", label: "Slash chords" }],
  roots: NOTES.map((n, i) => ({ id: String(i), label: FLATS[n] ? `${pretty(i)}/${FLATS[n]}` : n })),
};
const CHIP_BOXES = { types: "typeChips", roots: "rootChips" };

// Changing what's in the quiz starts a fresh deck
function restart() { save(); current = null; deck = []; nextRound(); }

function makeChips(group) {
  const box = $(CHIP_BOXES[group]);
  box.innerHTML = "";
  CHIP_ITEMS[group].forEach(({ id, label }) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.setAttribute("aria-pressed", settings[group].includes(id));
    b.onclick = () => {
      settings[group] = settings[group].includes(id) ? settings[group].filter(x => x !== id) : [...settings[group], id];
      b.setAttribute("aria-pressed", settings[group].includes(id));
      restart();
    };
    box.appendChild(b);
  });
}
// The "All" and "None" links
document.querySelectorAll("[data-all], [data-none]").forEach(btn => {
  btn.onclick = () => {
    const group = btn.dataset.all || btn.dataset.none;
    settings[group] = btn.dataset.all ? CHIP_ITEMS[group].map(i => i.id) : [];
    makeChips(group);
    restart();
  };
});

// ---------- Guitar or piano ----------
function setInstrument(inst) {
  settings.instrument = inst;
  document.querySelectorAll("[data-instrument]").forEach(b => b.setAttribute("aria-pressed", b.dataset.instrument === inst));
  document.querySelectorAll(".guitar-only").forEach(e => e.style.display = piano() ? "none" : "");
  $("hearBtn").textContent = piano() ? "▶ Play it" : "▶ Strum it";
  $("hint").innerHTML = "Chords you've been getting wrong come up more often, until you get them right a few times.<br>" + (piano()
    ? "The lit keys are the notes of the chord, played with the root at the bottom. The dark blue key is the root (unless you hide it)."
    : "How to read the diagram: the vertical lines are strings, the horizontal ones are frets. Dots are where your fingers go, ○ means play the string open, × means don't play it. A label like \"5fr\" means the diagram starts at the 5th fret. The lowest note played is the root, except in slash chords.")
    + "<br>Slash chords like G/B (a G chord with B as its lowest note) are answered with a third pick, the bass note; for a normal chord pick \"None\"."
    + `<br>${piano() ? "Piano" : "Guitar"} sounds: <a href="https://github.com/nbrosowsky/tonejs-instruments">tonejs-instruments</a> by Nicholas Brosowsky, licensed
    <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>.`;
  // A fresh start: the score and streak belong to one instrument
  correct = total = streak = 0;
  recent.use(recentKey());
  updateStats();
  restart();
}
document.querySelectorAll("[data-instrument]").forEach(b => b.onclick = () => setInstrument(b.dataset.instrument));

const hand = $("hand");
try { hand.value = localStorage.getItem("fretTrainerHand") || "right"; } catch (e) {} // shared with the fretboard trainer
hand.onchange = () => {
  try { localStorage.setItem("fretTrainerHand", hand.value); } catch (e) {}
  if (current) draw(current);
};
$("rootDot").onchange = () => { save(); if (current) draw(current); };
$("sound").onchange = save;
$("shapes").onchange = restart;
const showFilters = () => document.body.classList.toggle("known-only", knownOnly());
$("knownOnly").onchange = () => { showFilters(); restart(); };
showFilters();
$("hearBtn").onclick = () => { if (current) play(current); };

makeChips("types");
makeChips("roots");
setInstrument(settings.instrument);
</script>
</body>
</html>
